[project]
name = "vpv-ops"
version = "0.1.0"
description = "CLI for VPV production database operations"
requires-python = ">=3.12"
dependencies = [
    "rich>=13.0",
    "simple-term-menu>=1.6",
]

[project.scripts]
vpv-ops = "vpv_ops.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
