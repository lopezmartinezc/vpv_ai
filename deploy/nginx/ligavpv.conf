# Liga VPV — Nginx reverse proxy
# First install:  sudo cp deploy/nginx/ligavpv.conf /etc/nginx/conf.d/
#                 sudo certbot --nginx -d new.ligavpv.com
# WARNING: Do NOT overwrite in production — certbot adds SSL config.
#          If you need to add blocks, edit the production file manually.

upstream vpv_backend {
    server 127.0.0.1:8000;
}

upstream vpv_frontend {
    server 127.0.0.1:3000;
}

# HTTP — certbot will add the redirect and SSL block automatically
server {
    listen 80;
    listen [::]:80;
    server_name new.ligavpv.com;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;

    # Backend API
    location /api/ {
        proxy_pass http://vpv_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Longer timeout for scraping endpoints
        proxy_read_timeout 300s;
    }

    # Static assets (player photos) — aggressive caching
    location /static/ {
        proxy_pass http://vpv_backend;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Next.js static assets — served directly from disk (standalone build)
    location /_next/static/ {
        alias /opt/vpv/frontend/.next/static/;
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Next.js public assets (favicon, etc.)
    location /favicon.svg {
        alias /opt/vpv/frontend/public/favicon.svg;
        expires 30d;
        access_log off;
    }

    # Frontend (Next.js via PM2)
    location / {
        proxy_pass http://vpv_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Deny access to dotfiles
    location ~ /\. {
        deny all;
        return 404;
    }
}
